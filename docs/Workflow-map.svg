<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-label="Chief Agent — workflow">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#587087"/></marker></defs>
<rect width="1500" height="1150" fill="#f3f6fa"/>
<style>text{font-family:Arial,sans-serif;fill:#173047}.title{font-size:34px;font-weight:700}.subtitle{font-size:19px;fill:#4e6578}.heading{font-size:23px;font-weight:700}.body{font-size:18px}.arrow{fill:none;stroke:#587087;stroke-width:2.5;marker-end:url(#arrow)}</style>
<text x="60" y="65" class="title">Chief Agent — workflow</text><text x="60" y="102" class="subtitle">Evidence first • clear access state • approval before external actions • uncertain outcomes never auto-retry</text>
<rect x="60" y="145" width="420" height="165" rx="16" fill="#e4efff" stroke="#cbd7e1"/>
<text x="82" y="181" class="heading">1. Start / schedule / command</text>
<text x="82" y="215" class="body">OS starts Chief Agent services</text>
<text x="82" y="244" class="body">Enabled + autostart agents may run</text>
<text x="82" y="273" class="body">Paused agents retain queued work</text>
<rect x="540" y="145" width="420" height="165" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="562" y="181" class="heading">2. Check source access</text>
<text x="562" y="215" class="body">New website: your authorization</text>
<text x="562" y="244" class="body">Paused / revoked: stop access</text>
<text x="562" y="273" class="body">Login expired: request your attention</text>
<rect x="1020" y="145" width="420" height="165" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="1042" y="181" class="heading">3. Read and assess jobs</text>
<text x="1042" y="215" class="body">Use authorized source/session</text>
<text x="1042" y="244" class="body">Extract actual listing information</text>
<text x="1042" y="273" class="body">Screen, match, rank and save</text>
<path d="M480,230 L540,230" class="arrow"/>
<path d="M960,230 L1020,230" class="arrow"/>
<rect x="60" y="430" width="420" height="195" rx="16" fill="#e4f5ee" stroke="#cbd7e1"/>
<text x="82" y="466" class="heading">4. Build an evidence-based draft</text>
<text x="82" y="500" class="body">Facts come from your confirmed store</text>
<text x="82" y="529" class="body">Each claim references a fact ID</text>
<text x="82" y="558" class="body">Unsupported text is rejected</text>
<text x="82" y="587" class="body">No confirmed facts: no usable draft</text>
<rect x="540" y="430" width="420" height="195" rx="16" fill="#fff3dd" stroke="#cbd7e1"/>
<text x="562" y="466" class="heading">5. Review before approval</text>
<text x="562" y="500" class="body">Inspect CV and cover letter</text>
<text x="562" y="529" class="body">Check claim evidence and relevance</text>
<text x="562" y="558" class="body">Check exact proposed form values</text>
<text x="562" y="587" class="body">Approve the specific external action</text>
<rect x="1020" y="430" width="420" height="195" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="1042" y="466" class="heading">6. Verify and submit</text>
<text x="1042" y="500" class="body">Recheck current facts + source access</text>
<text x="1042" y="529" class="body">Match the reviewed form / target</text>
<text x="1042" y="558" class="body">Reject unexpected form controls</text>
<text x="1042" y="587" class="body">Record submission intent before click</text>
<path d="M1230,310 L1230,365" class="arrow"/>
<path d="M1230,365 L270,365 L270,430" class="arrow"/>
<path d="M480,530 L540,530" class="arrow"/>
<path d="M960,530 L1020,530" class="arrow"/>
<rect x="60" y="745" width="420" height="190" rx="16" fill="#e4f5ee" stroke="#cbd7e1"/>
<text x="82" y="781" class="heading">Confirmed outcome</text>
<text x="82" y="815" class="body">Website explicitly confirms receipt</text>
<text x="82" y="844" class="body">Record confirmation and snapshot</text>
<text x="82" y="873" class="body">Mark application submitted</text>
<text x="82" y="902" class="body">Block duplicate submission</text>
<rect x="540" y="745" width="420" height="190" rx="16" fill="#ffe9e5" stroke="#cbd7e1"/>
<text x="562" y="781" class="heading">Uncertain outcome</text>
<text x="562" y="815" class="body">Click or connection outcome unclear</text>
<text x="562" y="844" class="body">Mark submission unresolved</text>
<text x="562" y="873" class="body">Do not automatically resubmit</text>
<text x="562" y="902" class="body">You check the website before retrying</text>
<rect x="1020" y="745" width="420" height="190" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="1042" y="781" class="heading">Recommendation loop</text>
<text x="1042" y="815" class="body">Notify through available channels</text>
<text x="1042" y="844" class="body">Dismiss without enabling access</text>
<text x="1042" y="873" class="body">Fresh reason can resurface a site</text>
<text x="1042" y="902" class="body">Only you can resume revoked access</text>
<path d="M1230,625 L1230,680 L270,680 L270,745" class="arrow"/>
<path d="M750,680 L750,745" class="arrow"/>
<path d="M1230,680 L1230,745" class="arrow"/>
<rect x="60" y="980" width="1380" height="140" rx="16" fill="#e4efff" stroke="#cbd7e1"/>
<text x="82" y="1016" class="heading">Farm Agent: minimal workspace, preserved local proof</text>
<text x="82" y="1050" class="body">Registered action → capability check → shared worker → agent-scoped record / reminder.</text>
<text x="82" y="1079" class="body">No farm AI or external actions. Interrupted external actions require review; restarting does not replay them.</text>
</svg>