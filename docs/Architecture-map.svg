<text x="82" y="760" class="body">Jobs and confirmed candidate facts</text>
<text x="82" y="789" class="body">Farm: user-recorded soil measurements</text>
<text x="82" y="818" class="body">Domain-scoped records and reminders</text>
<text x="82" y="847" class="body">Shared queue, audit and dashboard inbox</text>
<rect x="540" y="690" width="420" height="190" rx="16" fill="#f1eaff" stroke="#cbd7e1"/>
<text x="562" y="726" class="heading">Private deployment state</text>
<text x="562" y="760" class="body">Provider / email credentials</text>
<text x="562" y="789" class="body">SQLite, facts and site session data</text>
<text x="562" y="818" class="body">OS-specific private storage required</text>
<text x="562" y="847" class="body">Private state excluded from release ZIP</text>
<rect x="1020" y="690" width="420" height="190" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
