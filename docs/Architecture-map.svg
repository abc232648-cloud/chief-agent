<path d="M960,230 L1020,230" class="arrow"/>
<rect x="60" y="405" width="420" height="190" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="82" y="441" class="heading">Registry + shared worker</text>
<text x="82" y="475" class="body">Access / pause / independent autostart</text>
<text x="82" y="504" class="body">Declared capabilities + Policy Gate</text>
<text x="82" y="533" class="body">Heartbeat and recorded task activity</text>
<text x="82" y="562" class="body">Farm: minimal workspace and records</text>
<rect x="540" y="405" width="420" height="190" rx="16" fill="#fff3dd" stroke="#cbd7e1"/>
<text x="562" y="441" class="heading">AI planning + Policy Gate</text>
<text x="562" y="475" class="body">Qwen; existing Mistral fallback</text>
<text x="562" y="504" class="body">Existing free-only configuration</text>
<text x="562" y="533" class="body">Plans are data, not permission</text>
<text x="562" y="562" class="body">High-impact steps await your approval</text>
<rect x="1020" y="405" width="420" height="190" rx="16" fill="#ffffff" stroke="#cbd7e1"/>
<text x="1042" y="441" class="heading">Website readers / executors</text>
<text x="1042" y="475" class="body">Read-only job research</text>
<text x="1042" y="504" class="body">Saved access checked before reading</text>
<text x="1042" y="533" class="body">Form values checked against evidence</text>
<text x="1042" y="562" class="body">Submission requires site confirmation</text>
