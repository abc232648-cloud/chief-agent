<text x="562" y="181" class="heading">Dashboard HTTP server</text>
<text x="562" y="215" class="body">dashboard_app.py + HTML/CSS/JS</text>
<text x="562" y="244" class="body">Local address: 127.0.0.1:8765</text>
<text x="562" y="273" class="body">Queues commands; records approvals</text>
<rect x="1020" y="145" width="420" height="170" rx="16" fill="#e4f5ee" stroke="#cbd7e1"/>
<text x="1042" y="181" class="heading">Manual sign-in on Folio</text>
<text x="1042" y="215" class="body">User enters credentials; approved sites</text>
<text x="1042" y="244" class="body">Site session saved on that machine</text>
<text x="1042" y="273" class="body">Pause / timed suspension / revoke</text>
