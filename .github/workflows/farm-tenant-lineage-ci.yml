name: Farm Tenant Lineage CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/farm_api.py'
      - 'domains/farming/scope.py'
      - 'domains/farming/setup.py'
      - 'domains/farming/journal.py'
      - 'domains/farming/tasks.py'
      - 'domains/farming/incidents.py'
      - 'domains/farming/reports.py'
      - 'domains/farming/sops.py'
      - 'domains/farming/notification_events.py'
      - 'domains/tenancy.py'
      - 'domains/ownership.py'
      - 'tests/test_farm_tenant_lineage.py'
      - 'tests/test_farm_tenant_sops.py'
      - '.github/workflows/farm-tenant-lineage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: farm-tenant-lineage-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  farm-tenant-lineage:
    name: Farm tenant lineage (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tenant lineage and ownership scope tests
        run: >-
          python -m pytest -q
          tests/test_farm_tenant_lineage.py
          tests/test_farm_tenant_sops.py
          tests/test_tenancy_scope.py
          tests/test_ownership_catalog.py
          tests/test_ownership_http.py
