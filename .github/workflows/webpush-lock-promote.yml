name: Promote Proven Web Push Locks

on:
  push:
    branches: ['consolidate/job-pwa-backend-current']
    paths:
      - '.github/workflows/webpush-lock-promote.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate/job-pwa-backend-current
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install release validation dependency
        run: python -m pip install 'pytest>=9,<10'
      - name: Download proven Ubuntu lock from run 37822223470
        uses: actions/download-artifact@v4
        with:
          name: webpush-lock-Linux
          path: candidate/ubuntu
          github-token: ${{ github.token }}
          repository: abc232648-cloud/chief-agent
          run-id: '37822223470'
      - name: Download proven Windows lock from run 37822223470
        uses: actions/download-artifact@v4
        with:
          name: webpush-lock-Windows
          path: candidate/windows
          github-token: ${{ github.token }}
          repository: abc232648-cloud/chief-agent
          run-id: '37822223470'
      - name: Verify artifact digests
        shell: python
        run: |
          import hashlib
          from pathlib import Path
          expected = {
              Path('candidate/ubuntu/ubuntu-webpush-hashed.txt'): '4b0b0ac4b0ba9e58e8243ae8efa91180a4aa9d920910e87db7d5b87737dea572',
              Path('candidate/windows/windows-webpush-hashed.txt'): '19d0b6bd440eb68a9fa4ce198001ff9022800802fc3a5af2829b7e24ab185059',
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f'{path}: digest mismatch {actual}')
      - name: Promote only drift-free candidates
        run: >-
          python tools/promote_webpush_lock.py
          --ubuntu candidate/ubuntu/ubuntu-webpush-hashed.txt
          --windows candidate/windows/windows-webpush-hashed.txt
      - name: Validate promoted release manifests
        run: python -m pytest -q tests/test_release_package.py
      - name: Show promotion diff
        run: git diff --check && git diff --stat && git status --short
      - name: Commit verified runtime manifests and retire staging tooling
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add requirements.txt release/ubuntu-hashed.txt release/windows-hashed.txt release/ubuntu-inventory.json release/windows-inventory.json
          git rm .github/workflows/webpush-lock-candidate.yml .github/workflows/webpush-lock-promote.yml tools/resolve_webpush_lock.py tools/promote_webpush_lock.py
          git diff --cached --check
          git status --short
          git commit -m 'build(release): pin Web Push runtime dependencies'
          git push origin HEAD:refs/heads/consolidate/job-pwa-backend-current
