name: Agent Manifest, Registry, Interface & Capability CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'agents/manifest.py'
      - 'agents/discovery.py'
      - 'agents/interfaces.py'
      - 'agents/registry.py'
      - 'capabilities/registry.py'
      - 'domains/contracts.py'
      - 'domains/jobs/manifest.py'
      - 'domains/farming/manifest.py'
      - 'application/composition.py'
      - 'tests/test_agent_manifest.py'
      - 'tests/test_agent_discovery_registry.py'
      - 'tests/test_interface_registry.py'
      - 'tests/test_agent_capability_integration.py'
      - 'tests/test_application_composition.py'
      - '.github/workflows/agent-manifest-ci.yml'
  push:
    branches: [main]
    paths:
      - 'agents/manifest.py'
      - 'agents/discovery.py'
      - 'agents/interfaces.py'
      - 'agents/registry.py'
      - 'capabilities/registry.py'
      - 'domains/contracts.py'
      - 'domains/jobs/manifest.py'
      - 'domains/farming/manifest.py'
      - 'application/composition.py'
      - 'tests/test_agent_manifest.py'
      - 'tests/test_agent_discovery_registry.py'
      - 'tests/test_interface_registry.py'
      - 'tests/test_agent_capability_integration.py'
      - 'tests/test_application_composition.py'
      - '.github/workflows/agent-manifest-ci.yml'

permissions:
  contents: read

concurrency:
  group: agent-manifest-registry-interface-capability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile manifest, registry, interface and capability surfaces
        run: >-
          python -m compileall -q
          agents/manifest.py
          agents/discovery.py
          agents/interfaces.py
          agents/registry.py
          capabilities/registry.py
          application/composition.py
          domains/contracts.py
          domains/jobs/manifest.py
          domains/farming/manifest.py
      - name: Run manifest, registry, interface, capability and composition tests
        run: >-
          python -m pytest -q
          tests/test_agent_manifest.py
          tests/test_agent_discovery_registry.py
          tests/test_interface_registry.py
          tests/test_agent_capability_integration.py
          tests/test_application_composition.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run complete Chief pytest suite
        run: python -m pytest -q
