name: Job PWA Backend CI

on:
  push:
    branches: [main, "feat/job-pwa-web-push"]
    paths:
      - "notifications/**"
      - "domains/jobs/**"
      - "control/api.py"
      - "tests/test_job_webpush.py"
      - "requirements.txt"
      - ".github/workflows/job-pwa-ci.yml"
  pull_request:
    paths:
      - "notifications/**"
      - "domains/jobs/**"
      - "control/api.py"
      - "tests/test_job_webpush.py"
      - "requirements.txt"
      - ".github/workflows/job-pwa-ci.yml"

permissions:
  contents: read

jobs:
  job-pwa-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_job_webpush.py tests/test_notifications.py
