name: Module Exposure CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'control/module_exposure.py'
      - 'application/exposure.py'
      - 'application/auth_routes.py'
      - 'application/ui_api.py'
      - 'dashboard_app.py'
      - 'agents/interfaces.py'
      - 'tests/test_module_exposure.py'
      - 'agents/module_compatibility.py'
      - 'agents/manifest.py'
      - 'agents/discovery.py'
      - 'control/module_lifecycle.py'
      - 'application/control_services.py'
      - 'domains/**/manifest.py'
      - 'tests/test_module_compatibility.py'
      - 'tests/test_module_lifecycle.py'
      - 'tests/test_architecture_boundaries.py'
      - 'docs/Module-exposure.md'
      - 'docs/Module-compatibility.md'
      - 'docs/Module-lifecycle.md'
      - '.github/workflows/module-exposure-ci.yml'
  push:
    branches: [main]
    paths:
      - 'control/module_exposure.py'
      - 'application/exposure.py'
      - 'application/auth_routes.py'
      - 'application/ui_api.py'
      - 'dashboard_app.py'
      - 'agents/interfaces.py'
      - 'tests/test_module_exposure.py'
      - 'agents/module_compatibility.py'
      - 'agents/manifest.py'
      - 'agents/discovery.py'
      - 'control/module_lifecycle.py'
      - 'application/control_services.py'
      - 'domains/**/manifest.py'
      - 'tests/test_module_compatibility.py'
      - 'tests/test_module_lifecycle.py'
      - 'tests/test_architecture_boundaries.py'
      - 'docs/Module-exposure.md'
      - 'docs/Module-compatibility.md'
      - 'docs/Module-lifecycle.md'
      - '.github/workflows/module-exposure-ci.yml'

permissions:
  contents: read

concurrency:
  group: module-exposure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile exposure, compatibility and lifecycle boundaries
        run: >-
          python -m compileall -q
          control/module_exposure.py
          application/exposure.py
          agents/module_compatibility.py
          agents/manifest.py
          agents/discovery.py
          control/module_lifecycle.py
          application/control_services.py
      - name: Run exposure, authorization, compatibility and lifecycle tests
        run: >-
          python -m pytest -q
          tests/test_module_exposure.py
          tests/test_checkpoint_h_api.py
          tests/test_identity_http.py
          tests/test_module_compatibility.py
          tests/test_module_lifecycle.py
          tests/test_architecture_boundaries.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run complete Chief pytest suite
        run: python -m pytest -q
