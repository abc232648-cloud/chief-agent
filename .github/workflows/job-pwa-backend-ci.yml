name: Job Agent PWA Backend CI

on:
  push:
    branches: [main]
    paths:
      - '.env.example'
      - 'notifications/web_push.py'
      - 'notifications/device_push.py'
      - 'control/notifications.py'
      - 'worker/runner.py'
      - 'worker/command_processor.py'
      - 'domains/jobs/**'
      - 'skills/job_pipeline.py'
      - 'skills/job_ranking.py'
      - 'skills/ai_job_analysis/**'
      - 'application/job_activity_feed.py'
      - 'application/research_router.py'
      - 'application/ui_api.py'
      - 'runtime_qualification/**'
      - 'update_center/**'
      - 'scheduler.py'
      - 'config/runtime_candidates.json'
      - 'config/runtime_policy.json'
      - 'config/research_policy.json'
      - 'config/dependency_update_policy.json'
      - 'requirements.txt'
      - 'requirements-scrapy.txt'
      - 'static/auth-bridge.js'
      - 'static/work.js'
      - 'tests/test_chief_browser.py'
      - 'tests/test_farm_offline.py'
      - 'tests/test_farm_labour.py'
      - 'tests/test_farm_finance_expansion.py'
      - 'tests/test_farm_photos.py'
      - 'tests/test_farm_release_boundaries.py'
      - 'tests/test_users_access.py'
      - 'tests/test_foundation_sessions.py'
      - 'tests/conftest.py'
      - 'tests/test_web_push.py'
      - 'tests/test_notifications.py'
      - 'tests/test_notification_dispatch_isolation.py'
      - 'tests/test_job_*.py'
      - 'tests/test_research_routing.py'
      - 'tests/test_runtime_qualification.py'
      - 'tests/test_runtime_profiles.py'
      - 'tests/test_dependency_updates.py'
      - 'docs/PWA-Routing.md'
      - 'docs/Dependency-Updates.md'
      - 'docs/Maintained-Runtimes.md'
      - '.github/workflows/job-pwa-backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '.env.example'
      - 'notifications/web_push.py'
      - 'notifications/device_push.py'
      - 'control/notifications.py'
      - 'worker/runner.py'
      - 'worker/command_processor.py'
      - 'domains/jobs/**'
      - 'skills/job_pipeline.py'
      - 'skills/job_ranking.py'
      - 'skills/ai_job_analysis/**'
      - 'application/job_activity_feed.py'
      - 'application/research_router.py'
      - 'application/ui_api.py'
      - 'runtime_qualification/**'
      - 'update_center/**'
      - 'scheduler.py'
      - 'config/runtime_candidates.json'
      - 'config/runtime_policy.json'
      - 'config/research_policy.json'
      - 'config/dependency_update_policy.json'
      - 'requirements.txt'
      - 'requirements-scrapy.txt'
      - 'static/auth-bridge.js'
      - 'static/work.js'
      - 'tests/test_chief_browser.py'
      - 'tests/test_farm_offline.py'
      - 'tests/test_farm_labour.py'
      - 'tests/test_farm_finance_expansion.py'
      - 'tests/test_farm_photos.py'
      - 'tests/test_farm_release_boundaries.py'
      - 'tests/test_users_access.py'
      - 'tests/test_foundation_sessions.py'
      - 'tests/conftest.py'
      - 'tests/test_web_push.py'
      - 'tests/test_notifications.py'
      - 'tests/test_notification_dispatch_isolation.py'
      - 'tests/test_job_*.py'
      - 'tests/test_research_routing.py'
      - 'tests/test_runtime_qualification.py'
      - 'tests/test_runtime_profiles.py'
      - 'tests/test_dependency_updates.py'
      - 'docs/PWA-Routing.md'
      - 'docs/Dependency-Updates.md'
      - 'docs/Maintained-Runtimes.md'
      - '.github/workflows/job-pwa-backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: job-pwa-backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.14'
          cache: pip
      - name: Install Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for focused browser regressions
        run: python -m playwright install --with-deps chromium
      - name: Compile Job, research, runtime and maintenance surfaces
        run: >-
          python -m compileall -q
          notifications/web_push.py
          notifications/device_push.py
          control/notifications.py
          worker/runner.py
          worker/command_processor.py
          application/job_activity_feed.py
          application/research_router.py
          application/ui_api.py
          runtime_qualification
          update_center
          scheduler.py
      - name: Run Job, notification, research, runtime and update focused regressions
        run: >-
          python -m pytest -q
          tests/test_web_push.py
          tests/test_notifications.py
          tests/test_notification_dispatch_isolation.py
          tests/test_job_attention.py
          tests/test_job_activity_feed.py
          tests/test_job_pwa_ui.py
          tests/test_job_push_http.py
          tests/test_job_board_sources.py
          tests/test_job_evidence_adapter.py
          tests/test_job_pipeline.py
          tests/test_job_ranking.py
          tests/test_job_record_coverage.py
          tests/test_research_routing.py
          tests/test_runtime_qualification.py
          tests/test_runtime_profiles.py
          tests/test_dependency_updates.py
      - name: Verify browser navigation and session regressions
        run: >-
          python -m pytest -q
          tests/test_chief_browser.py
          tests/test_farm_offline.py
          tests/test_farm_labour.py::test_browser_correction_waits_for_record_refresh
          tests/test_farm_finance_expansion.py::test_browser_creates_contact_line_item_and_private_receipt
          tests/test_farm_release_boundaries.py::test_finance_reference_selection_is_visible_and_never_saves
          tests/test_farm_photos.py
          tests/test_users_access.py::test_worker_cannot_open_users_in_browser
          tests/test_foundation_sessions.py

  full-suite:
    name: Full suite (${{ matrix.label }})
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12.14'
            label: linux-py312
            timeout: 45
          - os: ubuntu-latest
            python: '3.14.4'
            label: linux-py314
            timeout: 45
          - os: windows-latest
            python: '3.12'
            label: windows-py312
            timeout: 75
    runs-on: ${{ matrix.os }}
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Report exact Python version
        run: python --version
      - name: Install complete Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Linux Chromium dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Windows Chromium
        if: runner.os == 'Windows'
        run: python -m playwright install chromium
      - name: Run complete Chief pytest suite
        run: python -m pytest -q
