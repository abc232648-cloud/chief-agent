name: Job Agent PWA Backend CI

on:
  push:
    branches: [main, 'feat/**', 'consolidate/**']
    paths:
      - '.env.example'
      - 'notifications/web_push.py'
      - 'control/notifications.py'
      - 'worker/runner.py'
      - 'worker/command_processor.py'
      - 'domains/jobs/__init__.py'
      - 'application/job_activity_feed.py'
      - 'application/ui_api.py'
      - 'requirements.txt'
      - 'tests/conftest.py'
      - 'tests/test_web_push.py'
      - 'tests/test_notifications.py'
      - 'tests/test_job_attention.py'
      - 'tests/test_job_activity_feed.py'
      - 'tests/test_job_pwa_ui.py'
      - 'tests/test_job_push_http.py'
      - 'docs/PWA-Routing.md'
      - '.github/workflows/job-pwa-backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - '.env.example'
      - 'notifications/web_push.py'
      - 'control/notifications.py'
      - 'worker/runner.py'
      - 'worker/command_processor.py'
      - 'domains/jobs/__init__.py'
      - 'application/job_activity_feed.py'
      - 'application/ui_api.py'
      - 'requirements.txt'
      - 'tests/conftest.py'
      - 'tests/test_web_push.py'
      - 'tests/test_notifications.py'
      - 'tests/test_job_attention.py'
      - 'tests/test_job_activity_feed.py'
      - 'tests/test_job_pwa_ui.py'
      - 'tests/test_job_push_http.py'
      - 'docs/PWA-Routing.md'
      - '.github/workflows/job-pwa-backend-ci.yml'

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile changed Python surfaces
        run: >-
          python -m compileall -q
          notifications/web_push.py
          control/notifications.py
          worker/runner.py
          worker/command_processor.py
          application/job_activity_feed.py
          application/ui_api.py
      - name: Run Job PWA notification, privacy, authority and delivery tests
        run: >-
          python -m pytest -q
          tests/test_web_push.py
          tests/test_notifications.py
          tests/test_job_attention.py
          tests/test_job_activity_feed.py
          tests/test_job_pwa_ui.py
          tests/test_job_push_http.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHIEF_INSTANCE_MODE: test
      # Hosted runners do not expose Chief's host-bound systemd credential key.
      # Tests use an explicit process-local AES-GCM double; production keeps the
      # real systemd-creds fail-closed backend and has no plaintext fallback.
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run complete Chief pytest suite
        run: python -m pytest -q
