name: Chief scoped secure DNS
on:
  push:
    branches: ['security/chief-scoped-dns']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dns:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: >-
          python -m pytest -q
          tests/test_dns_policy.py tests/test_browser_egress.py tests/test_browser_runtime.py
          tests/test_production_prepare.py tests/test_production_https_policy.py
          tests/test_install_readiness.py tests/test_first_install_contract.py
          tests/test_update_acquisition.py tests/test_update_requirements.py
          tests/test_checkpoint_g_boundaries.py tests/test_policy.py
          tests/test_policy_foundation.py tests/test_worker_policy_gate.py
          tests/test_policy_equivalence.py
