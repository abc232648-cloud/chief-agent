name: Farm Staff CI

on:
  push:
    branches: [main]
    paths:
      - 'domains/farming/tasks.py'
      - 'domains/farming/reports.py'
      - 'domains/farming/team.py'
      - 'domains/farming/staff.py'
      - 'application/farm_api.py'
      - 'tests/test_farm_tasks.py'
      - 'tests/test_farm_worker_reports.py'
      - 'tests/test_farm_team.py'
      - '.github/workflows/farm-task-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'domains/farming/tasks.py'
      - 'domains/farming/reports.py'
      - 'domains/farming/team.py'
      - 'domains/farming/staff.py'
      - 'application/farm_api.py'
      - 'tests/test_farm_tasks.py'
      - 'tests/test_farm_worker_reports.py'
      - 'tests/test_farm_team.py'
      - '.github/workflows/farm-task-ci.yml'

concurrency:
  group: farm-staff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Run Farm Staff authority tests
        env:
          CHIEF_INSTANCE_MODE: test
        run: python -m pytest -q tests/test_farm_tasks.py tests/test_farm_worker_reports.py tests/test_farm_team.py
