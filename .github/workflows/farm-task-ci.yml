name: Farm Staff CI

on:
  push:
    branches: [main]
    paths:
      - 'domains/farming/tasks.py'
      - 'domains/farming/reports.py'
      - 'domains/farming/incidents.py'
      - 'domains/farming/sops.py'
      - 'domains/farming/team.py'
      - 'domains/farming/staff.py'
      - 'domains/farming/photos.py'
      - 'domains/farming/bookkeeping.py'
      - 'domains/farming/finance.py'
      - 'domains/farming/financial_permissions.py'
      - 'domains/farming/health_records.py'
      - 'application/farm_api.py'
      - 'application/farm_release.py'
      - 'application/http_transport.py'
      - 'deployment/launch.py'
      - 'deployment/https_policy.py'
      - 'static/farm-finance.js'
      - 'static/farm-outbox.js'
      - 'static/farm-offline.js'
      - 'static/farm-offline.html'
      - 'static/farm-sw.js'
      - 'tests/test_farm_tasks.py'
      - 'tests/test_farm_worker_reports.py'
      - 'tests/test_farm_incidents.py'
      - 'tests/test_farm_sops.py'
      - 'tests/test_farm_team.py'
      - 'tests/test_farm_photos.py'
      - 'tests/test_farm_bookkeeping.py'
      - 'tests/test_farm_financial_permissions.py'
      - 'tests/test_farm_treatment_restrictions.py'
      - 'tests/test_farm_finance_treatment_ui_contract.py'
      - 'tests/test_farm_offline.py'
      - 'tests/test_farm_operational_chain.py'
      - 'tests/test_farm_production_gate.py'
      - 'tests/test_production_https_policy.py'
      - 'tests/test_production_https_transport.py'
      - 'tests/test_production_route_contract.py'
      - '.github/workflows/farm-task-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'domains/farming/tasks.py'
      - 'domains/farming/reports.py'
      - 'domains/farming/incidents.py'
      - 'domains/farming/sops.py'
      - 'domains/farming/team.py'
      - 'domains/farming/staff.py'
      - 'domains/farming/photos.py'
      - 'domains/farming/bookkeeping.py'
      - 'domains/farming/finance.py'
      - 'domains/farming/financial_permissions.py'
      - 'domains/farming/health_records.py'
      - 'application/farm_api.py'
      - 'application/farm_release.py'
      - 'application/http_transport.py'
      - 'deployment/launch.py'
      - 'deployment/https_policy.py'
      - 'static/farm-finance.js'
      - 'static/farm-outbox.js'
      - 'static/farm-offline.js'
      - 'static/farm-offline.html'
      - 'static/farm-sw.js'
      - 'tests/test_farm_tasks.py'
      - 'tests/test_farm_worker_reports.py'
      - 'tests/test_farm_incidents.py'
      - 'tests/test_farm_sops.py'
      - 'tests/test_farm_team.py'
      - 'tests/test_farm_photos.py'
      - 'tests/test_farm_bookkeeping.py'
      - 'tests/test_farm_financial_permissions.py'
      - 'tests/test_farm_treatment_restrictions.py'
      - 'tests/test_farm_finance_treatment_ui_contract.py'
      - 'tests/test_farm_offline.py'
      - 'tests/test_farm_operational_chain.py'
      - 'tests/test_farm_production_gate.py'
      - 'tests/test_production_https_policy.py'
      - 'tests/test_production_https_transport.py'
      - 'tests/test_production_route_contract.py'
      - '.github/workflows/farm-task-ci.yml'

concurrency:
  group: farm-staff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staff-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-test.txt
      - name: Install Chromium for Staff browser tests
        run: python -m playwright install --with-deps chromium
      - name: Run Farm Staff authority, finance/treatment, production-gate and HTTPS tests
        env:
          CHIEF_INSTANCE_MODE: test
          CHIEF_TEST_SECRET_BACKEND: portable-aead
        run: >-
          python -m pytest -q
          tests/test_farm_tasks.py
          tests/test_farm_worker_reports.py
          tests/test_farm_incidents.py
          tests/test_farm_sops.py
          tests/test_farm_team.py
          tests/test_farm_photos.py
          tests/test_farm_bookkeeping.py
          tests/test_farm_financial_permissions.py
          tests/test_farm_treatment_restrictions.py
          tests/test_farm_finance_treatment_ui_contract.py
          tests/test_farm_offline.py
          tests/test_farm_operational_chain.py
          tests/test_farm_production_gate.py
          tests/test_production_https_policy.py
          tests/test_production_https_transport.py
          tests/test_production_route_contract.py
