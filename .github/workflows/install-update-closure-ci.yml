name: Install and Update Closure CI

on:
  workflow_call:
  pull_request:
    branches: [main]
    paths:
      - 'application/update_coordinator.py'
      - 'application/update_manage.py'
      - 'deployment/__main__.py'
      - 'deployment/bootstrap_install.py'
      - 'deployment/install_backup.py'
      - 'deployment/install_chief.sh'
      - 'deployment/install_chief_xubuntu.sh'
      - 'deployment/installation_identity.py'
      - 'deployment/ownership_bootstrap.py'
      - 'deployment/install_readiness.py'
      - 'deployment/linux_service_control.py'
      - 'deployment/managed_launch.py'
      - 'deployment/prepare_instance.py'
      - 'deployment/release_set.py'
      - 'deployment/service_files.py'
      - 'deployment/source_manifest.py'
      - 'update_center/acquisition.py'
      - 'update_center/acceptance.py'
      - 'update_center/managed.py'
      - 'update_center/runtime_install.py'
      - 'tests/test_deployment_bootstrap.py'
      - 'tests/test_first_install_contract.py'
      - 'tests/test_installation_identity.py'
      - 'tests/test_ownership_bootstrap.py'
      - 'tests/test_install_readiness.py'
      - 'tests/test_install_backup.py'
      - 'tests/test_linux_service_control.py'
      - 'tests/test_managed_updates.py'
      - 'tests/test_production_prepare.py'
      - 'tests/test_release_set.py'
      - 'tests/test_update_acquisition.py'
      - 'tests/test_update_acceptance.py'
      - 'tests/test_update_coordinator.py'
      - 'tests/test_update_manage_cli.py'
      - 'tests/test_update_recovery.py'
      - 'tests/test_update_runtime_install.py'
      - '.github/workflows/install-update-closure-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: install-update-closure-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  closure-tests:
    name: Installation/update closure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run installation and update closure tests
        run: >-
          python -m pytest -q
          tests/test_deployment_bootstrap.py
          tests/test_first_install_contract.py
          tests/test_installation_identity.py
          tests/test_ownership_bootstrap.py
          tests/test_install_readiness.py
          tests/test_install_backup.py
          tests/test_managed_updates.py
          tests/test_production_prepare.py
          tests/test_update_runtime_install.py
          tests/test_update_acquisition.py
          tests/test_linux_service_control.py
          tests/test_update_acceptance.py
          tests/test_update_coordinator.py
          tests/test_update_manage_cli.py
          tests/test_update_recovery.py
          tests/test_release_set.py
          tests/test_deployment_definitions.py
