name: Web Push Lock Candidate

on:
  push:
    branches: ['consolidate/job-pwa-backend-current']
    paths:
      - 'tools/resolve_webpush_lock.py'
      - 'tools/promote_webpush_lock.py'
      - '.github/workflows/webpush-lock-candidate.yml'
      - 'release/ubuntu-inventory.json'
      - 'release/windows-inventory.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.14.4'
            inventory: release/ubuntu-inventory.json
            output: ubuntu-webpush-hashed.txt
          - os: windows-latest
            # Hosted Actions does not currently provide exact 3.12.14 on Windows.
            # Resolve on the maintained 3.12 ABI while preserving every exact
            # package/version recorded in the 3.12.14 Windows inventory.
            python: '3.12'
            inventory: release/windows-inventory.json
            output: windows-webpush-hashed.txt
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install lock tooling
        run: python -m pip install 'pip-tools>=7.5,<8'
      - name: Resolve exact candidate lock
        run: python tools/resolve_webpush_lock.py "${{ matrix.inventory }}" "${{ matrix.output }}" --webpush 2.5.0
      - name: Prove candidate installs with hashes
        run: python -m pip install --require-hashes -r "${{ matrix.output }}"
      - name: Prove Web Push imports
        run: python -c "import pywebpush; print(pywebpush.__version__ if hasattr(pywebpush, '__version__') else 'pywebpush-import-ok')"
      - name: Upload candidate lock
        uses: actions/upload-artifact@v4
        with:
          name: webpush-lock-${{ runner.os }}
          path: ${{ matrix.output }}
          if-no-files-found: error
          retention-days: 1

  promote:
    if: github.actor != 'github-actions[bot]'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consolidate/job-pwa-backend-current
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install release validation dependency
        run: python -m pip install 'pytest>=9,<10'
      - uses: actions/download-artifact@v4
        with:
          name: webpush-lock-Linux
          path: candidate/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: webpush-lock-Windows
          path: candidate/windows
      - name: Promote only drift-free candidates
        run: >-
          python tools/promote_webpush_lock.py
          --ubuntu candidate/ubuntu/ubuntu-webpush-hashed.txt
          --windows candidate/windows/windows-webpush-hashed.txt
      - name: Validate promoted release manifests
        run: python -m pytest -q tests/test_release_package.py
      - name: Remove one-off lock machinery
        run: git rm tools/resolve_webpush_lock.py tools/promote_webpush_lock.py .github/workflows/webpush-lock-candidate.yml
      - name: Commit evidence-backed runtime locks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.txt release/ubuntu-hashed.txt release/windows-hashed.txt release/ubuntu-inventory.json release/windows-inventory.json
          git diff --cached --check
          git commit -m "build(release): pin Web Push runtime dependencies"
          git push origin HEAD:consolidate/job-pwa-backend-current
