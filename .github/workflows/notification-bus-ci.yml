name: Shared Notification Event Bus CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'notifications/events.py'
      - 'notifications/bus.py'
      - 'notifications/models.py'
      - 'notifications/web_push.py'
      - 'control/notifications.py'
      - 'agents/interfaces.py'
      - 'agents/staff_roles.py'
      - 'domains/storage.py'
      - 'domains/farming/manifest.py'
      - 'domains/jobs/manifest.py'
      - 'tests/test_notification_bus.py'
      - 'tests/test_notifications.py'
      - 'tests/test_web_push.py'
      - 'tests/test_job_attention.py'
      - 'tests/test_job_push_http.py'
      - 'tests/test_farm_notification_privacy.py'
      - 'tests/test_architecture_boundaries.py'
      - 'tests/test_checkpoint_d_boundaries.py'
      - 'docs/Notification-event-bus.md'
      - '.github/workflows/notification-bus-ci.yml'
  push:
    branches: [main]
    paths:
      - 'notifications/events.py'
      - 'notifications/bus.py'
      - 'notifications/models.py'
      - 'notifications/web_push.py'
      - 'control/notifications.py'
      - 'agents/interfaces.py'
      - 'agents/staff_roles.py'
      - 'domains/storage.py'
      - 'domains/farming/manifest.py'
      - 'domains/jobs/manifest.py'
      - 'tests/test_notification_bus.py'
      - 'tests/test_notifications.py'
      - 'tests/test_web_push.py'
      - 'tests/test_job_attention.py'
      - 'tests/test_job_push_http.py'
      - 'tests/test_farm_notification_privacy.py'
      - 'tests/test_architecture_boundaries.py'
      - 'tests/test_checkpoint_d_boundaries.py'
      - 'docs/Notification-event-bus.md'
      - '.github/workflows/notification-bus-ci.yml'

permissions:
  contents: read

concurrency:
  group: shared-notification-bus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile shared notification surfaces
        run: >-
          python -m compileall -q
          notifications/events.py
          notifications/bus.py
          notifications/models.py
          notifications/web_push.py
          control/notifications.py
          agents/interfaces.py
          agents/staff_roles.py
          domains/storage.py
      - name: Run notification routing, privacy, architecture and Job compatibility tests
        run: >-
          python -m pytest -q
          tests/test_notification_bus.py
          tests/test_notifications.py
          tests/test_web_push.py
          tests/test_job_attention.py
          tests/test_job_push_http.py
          tests/test_farm_notification_privacy.py
          tests/test_architecture_boundaries.py
          tests/test_checkpoint_d_boundaries.py

  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install complete Chief test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Install Chromium for browser acceptance tests
        run: python -m playwright install --with-deps chromium
      - name: Run complete Chief pytest suite
        run: python -m pytest -q
