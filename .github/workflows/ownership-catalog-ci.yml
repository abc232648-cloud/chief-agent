name: Ownership Catalog CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'domains/ownership.py'
      - 'application/ownership_api.py'
      - 'tests/test_ownership_catalog.py'
      - '.github/workflows/ownership-catalog-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ownership-catalog-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ownership-tests:
    name: Ownership catalog (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CHIEF_INSTANCE_MODE: test
      CHIEF_TEST_SECRET_BACKEND: portable-aead
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run ownership catalog tests
        run: python -m pytest -q tests/test_ownership_catalog.py
